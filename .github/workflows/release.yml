name: Publish immutable Workshop SDK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish exact SDK asset
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          SDK_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${SDK_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Expected tag ${EXPECTED_TAG}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "SDK_VERSION=${SDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install the frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Test and pack exactly once
        run: pnpm run pack:release

      - name: Inspect the exact public package surface
        shell: bash
        run: |
          set -euo pipefail
          tarball="dist-package/lumina-workshop-sdk-${SDK_VERSION}.tgz"
          test -f "${tarball}"
          tar -tzf "${tarball}" | grep -v '/$' | LC_ALL=C sort \
            > /tmp/sdk-members.txt
          printf '%s\n' \
            package/LICENSE \
            package/README.md \
            package/dist/client.d.ts \
            package/dist/client.js \
            package/dist/contracts.d.ts \
            package/dist/contracts.js \
            package/dist/index.d.ts \
            package/dist/index.js \
            package/dist/theme.d.ts \
            package/dist/theme.js \
            package/package.json \
            | LC_ALL=C sort > /tmp/expected-sdk-members.txt
          cmp /tmp/expected-sdk-members.txt /tmp/sdk-members.txt
          node -e '
            const value = require("./package.json");
            for (const name of ["preinstall", "install", "postinstall", "prepare"]) {
              if (value.scripts?.[name]) process.exit(1);
            }
          '

      - name: Verify generated files did not change reviewed source
        run: git diff --exit-code

      - name: Create lowercase SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist-package
          tarball="lumina-workshop-sdk-${SDK_VERSION}.tgz"
          checksum="${tarball}.sha256"
          sha256sum "${tarball}" > "${checksum}"
          grep -Eq '^[0-9a-f]{64}  lumina-workshop-sdk-[0-9]+\.[0-9]+\.[0-9]+\.tgz$' \
            "${checksum}"

      - name: Publish exact GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${SDK_VERSION}"
          tarball="dist-package/lumina-workshop-sdk-${SDK_VERSION}.tgz"
          checksum="${tarball}.sha256"
          gh release create "${tag}" \
            "${tarball}" \
            "${checksum}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Lumina Workshop SDK ${SDK_VERSION}" \
            --notes "Immutable public SDK contract for Creative Workshop modules."
